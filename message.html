<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070b20">
  <title>目醒めレター | Your Message</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;700&display=swap">
  <style>
    :root {
      --bg-top: #070b20;
      --bg-mid: #13193f;
      --bg-bottom: #241234;
      --glow: rgba(242, 199, 124, 0.38);
      --line: rgba(255, 255, 255, 0.12);
      --card: rgba(9, 12, 34, 0.68);
      --text: #f5efe7;
      --muted: rgba(245, 239, 231, 0.72);
      --accent: #f2c77c;
      --accent-strong: #ffdca3;
      --message: rgba(255, 248, 239, 0.94);
      --message-text: #2a1a12;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Noto Sans JP', sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 20%, rgba(80, 100, 255, 0.18), transparent 30%),
        radial-gradient(circle at 80% 15%, rgba(255, 220, 150, 0.16), transparent 22%),
        radial-gradient(circle at 50% 75%, rgba(255, 120, 180, 0.14), transparent 32%),
        linear-gradient(180deg, var(--bg-top), var(--bg-mid) 45%, var(--bg-bottom));
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    body::before {
      background-image:
        radial-gradient(2px 2px at 14% 18%, rgba(255,255,255,0.9), transparent 60%),
        radial-gradient(1.5px 1.5px at 68% 22%, rgba(255,255,255,0.7), transparent 60%),
        radial-gradient(2px 2px at 74% 64%, rgba(255,215,160,0.9), transparent 60%),
        radial-gradient(1.5px 1.5px at 30% 72%, rgba(210,220,255,0.85), transparent 60%),
        radial-gradient(1px 1px at 82% 38%, rgba(255,255,255,0.7), transparent 60%),
        radial-gradient(1px 1px at 26% 44%, rgba(255,255,255,0.7), transparent 60%);
      animation: twinkle 6s ease-in-out infinite alternate;
    }

    body::after {
      background:
        linear-gradient(120deg, transparent 20%, rgba(255,255,255,0.06) 50%, transparent 80%);
      transform: translateX(-120%);
      animation: aurora 7s ease-in-out infinite;
      opacity: 0.9;
    }

    main {
      position: relative;
      width: min(920px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 48px 0 72px;
    }

    .shell {
      position: relative;
      padding: 28px;
      border: 1px solid var(--line);
      border-radius: 32px;
      background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.38);
      overflow: hidden;
    }

    .shell::before {
      content: '';
      position: absolute;
      inset: auto -10% 72% 50%;
      height: 240px;
      background: radial-gradient(circle, var(--glow), transparent 60%);
      filter: blur(12px);
      transform: translateX(-50%);
      pointer-events: none;
    }

    .hero,
    .status,
    .content {
      position: relative;
      z-index: 1;
    }

    .hero {
      text-align: center;
      padding: 28px 20px 8px;
    }

    .eyebrow {
      letter-spacing: 0.28em;
      text-transform: uppercase;
      font-size: 12px;
      color: var(--accent);
      margin-bottom: 16px;
    }

    h1 {
      margin: 0;
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(42px, 9vw, 84px);
      line-height: 0.92;
      font-weight: 600;
    }

    .lead {
      max-width: 560px;
      margin: 20px auto 0;
      font-size: 15px;
      line-height: 1.9;
      color: var(--muted);
    }

    .status {
      display: grid;
      place-items: center;
      min-height: 240px;
      padding: 32px 16px;
    }

    .orb {
      width: 112px;
      height: 112px;
      border-radius: 999px;
      background:
        radial-gradient(circle at 35% 35%, rgba(255,255,255,0.98), rgba(255,224,163,0.92) 34%, rgba(242, 199, 124, 0.34) 56%, transparent 70%);
      box-shadow: 0 0 38px rgba(242, 199, 124, 0.34);
      animation: breathe 2.8s ease-in-out infinite;
      margin-bottom: 20px;
    }

    .status-text {
      font-size: 15px;
      color: var(--muted);
      text-align: center;
      line-height: 1.8;
    }

    .content {
      display: none;
      opacity: 0;
      transform: translateY(24px);
      transition: opacity 900ms ease, transform 900ms ease;
      padding: 8px 0 0;
    }

    .content.is-visible {
      display: block;
      opacity: 1;
      transform: translateY(0);
    }

    .meta {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 22px;
    }

    .meta-card {
      padding: 18px 18px 16px;
      border-radius: 22px;
      background: var(--card);
      border: 1px solid var(--line);
      backdrop-filter: blur(10px);
    }

    .meta-label {
      display: block;
      margin-bottom: 8px;
      font-size: 12px;
      letter-spacing: 0.2em;
      color: var(--accent);
      text-transform: uppercase;
    }

    .meta-value {
      font-size: 20px;
      line-height: 1.45;
    }

    .message-list {
      display: grid;
      gap: 18px;
    }

    .message-card {
      position: relative;
      padding: 24px 22px 22px;
      border-radius: 28px;
      background: linear-gradient(180deg, rgba(255,255,255,0.16), rgba(255,255,255,0.04));
      border: 1px solid rgba(255,255,255,0.16);
      overflow: hidden;
      opacity: 0;
      transform: translateY(20px) scale(0.98);
      animation: rise 900ms ease forwards;
    }

    .message-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        linear-gradient(135deg, rgba(255,255,255,0.22), transparent 30%),
        radial-gradient(circle at top right, rgba(242,199,124,0.18), transparent 34%);
      pointer-events: none;
    }

    .message-index {
      position: relative;
      display: inline-flex;
      min-width: 42px;
      justify-content: center;
      align-items: center;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(242,199,124,0.15);
      color: var(--accent-strong);
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .message-body {
      position: relative;
      white-space: pre-wrap;
      font-size: 17px;
      line-height: 2;
      color: var(--message);
    }

    .error-card {
      max-width: 540px;
      padding: 28px 24px;
      border-radius: 28px;
      background: rgba(34, 11, 28, 0.72);
      border: 1px solid rgba(255, 170, 190, 0.22);
      text-align: center;
    }

    .error-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 40px;
      margin-bottom: 12px;
    }

    .error-text {
      color: var(--muted);
      line-height: 1.8;
    }

    @keyframes twinkle {
      from { opacity: 0.45; }
      to { opacity: 0.9; }
    }

    @keyframes aurora {
      0% { transform: translateX(-120%); }
      50% { transform: translateX(20%); }
      100% { transform: translateX(120%); }
    }

    @keyframes breathe {
      0%, 100% { transform: scale(0.96); }
      50% { transform: scale(1.06); }
    }

    @keyframes rise {
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @media (max-width: 720px) {
      main {
        width: min(100vw - 20px, 920px);
        padding: 16px 0 32px;
      }

      .shell {
        padding: 18px;
        border-radius: 24px;
      }

      .meta {
        grid-template-columns: 1fr;
      }

      .message-body {
        font-size: 15px;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="shell">
      <header class="hero">
        <p class="eyebrow">Mezame Letter</p>
        <h1>Open Your Sky</h1>
        <p class="lead">このページは、あなた宛てに届いた目醒めレターを開くための専用ページです。静かな演出のあとに、預けられた言葉が現れます。</p>
      </header>

      <section class="status" id="status">
        <div>
          <div class="orb" aria-hidden="true"></div>
          <p class="status-text" id="statusText">メッセージを受信しています…</p>
        </div>
      </section>

      <section class="content" id="content" aria-live="polite">
        <div class="meta">
          <article class="meta-card">
            <span class="meta-label">To</span>
            <strong class="meta-value" id="recipientName">-</strong>
          </article>
          <article class="meta-card">
            <span class="meta-label">From</span>
            <strong class="meta-value" id="senderName">-</strong>
          </article>
        </div>
        <div class="message-list" id="messageList"></div>
      </section>
    </section>
  </main>

  <script>
    (function () {
      var statusEl = document.getElementById('status');
      var statusTextEl = document.getElementById('statusText');
      var contentEl = document.getElementById('content');
      var recipientNameEl = document.getElementById('recipientName');
      var senderNameEl = document.getElementById('senderName');
      var messageListEl = document.getElementById('messageList');

      function setStatus(message) {
        statusTextEl.textContent = message;
      }

      function showError(message) {
        statusEl.innerHTML = [
          '<div class="error-card">',
          '<div class="error-title">Not Found</div>',
          '<p class="error-text">' + escapeHtml(message) + '</p>',
          '</div>'
        ].join('');
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function createMessageCard(message, index) {
        return [
          '<article class="message-card" style="animation-delay:' + (index * 180) + 'ms;">',
          '<span class="message-index">Message ' + (index + 1) + '</span>',
          '<div class="message-body">' + escapeHtml(message) + '</div>',
          '</article>'
        ].join('');
      }

      function getToken() {
        var params = new URLSearchParams(window.location.search);
        return (params.get('token') || '').trim();
      }

      function renderPayload(payload) {
        recipientNameEl.textContent = payload.recipientName || 'あなた';
        senderNameEl.textContent = payload.senderName || '目醒め人';
        messageListEl.innerHTML = (payload.messages || []).map(function (entry, index) {
          var text = entry && entry.message ? entry.message : '';
          return createMessageCard(text, index);
        }).join('');

        statusEl.style.display = 'none';
        contentEl.classList.add('is-visible');
      }

      async function run() {
        var token = getToken();
        if (!token) {
          showError('URL に必要なトークンがありません。メールに記載されたリンクを開いてください。');
          return;
        }

        try {
          setStatus('光の封をほどいています…');
          var response = await fetch('/api/message-view?token=' + encodeURIComponent(token), {
            method: 'GET',
            headers: {
              'Accept': 'application/json'
            }
          });

          var payload = await response.json();
          if (!response.ok || !payload.ok) {
            throw new Error(payload && payload.message ? payload.message : 'メッセージを取得できませんでした。');
          }

          setStatus('あなた宛ての言葉を整えています…');
          window.setTimeout(function () {
            renderPayload(payload);
          }, 1400);
        } catch (error) {
          showError(error && error.message ? error.message : 'メッセージを取得できませんでした。');
        }
      }

      run();
    }());
  </script>
</body>
</html>
